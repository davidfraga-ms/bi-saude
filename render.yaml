services:
  # ==========================================
  # BACKEND (Web Service via Docker)
  # ==========================================
  - type: web
    name: bi-saude-backend
    runtime: docker
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PORT
        value: "8000"
      - key: OPENAI_API_KEY
        sync: false

  # ==========================================
  # FRONTEND (Static Site - Sintaxe correta)
  # ==========================================
  - type: web
    name: bi-saude-frontend
    runtime: static
    rootDir: ./frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: "https://bi-saude-backend.onrender.com"
