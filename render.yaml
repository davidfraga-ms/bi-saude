services:
  # ==========================================
  # BACKEND (Web Service via Docker)
  # ==========================================
  - type: web
    name: bi-saude-backend
    runtime: docker
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      # Assegura que o Render injete a porta correta
      - key: PORT
        value: "8000"
      # Exemplo de variáveis adicionais (segredos devem ser definidos no painel)
      # - key: SECRET_KEY
      #   generateValue: true

  # ==========================================
  # FRONTEND (Static Site - Recomendado para Vite)
  # ==========================================
  - type: web
    name: bi-saude-frontend
    runtime: static
    plan: free
    rootDir: ./frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      # Regra para suportar rotas de client-side routing (React/Vue/Svelte Router)
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: bi-saude-backend
          property: host