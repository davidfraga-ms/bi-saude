services:
  # ==========================================
  # BACKEND (Web Service via Docker)
  # ==========================================
  - type: web
    name: bi-saude-backend
    runtime: docker
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PORT
        value: "8000"
      - key: OPENAI_API_KEY
        sync: false  # Você preenche a chave pelo painel do Render

  # ==========================================
  # FRONTEND (Static Site - Corrigido)
  # ==========================================
  - type: static
    name: bi-saude-frontend
    rootDir: ./frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: bi-saude-backend
          property: host